name: fucking-cool-ai-bot

services:
  bot:
    build: .
    container_name: fcai-bot
    env_file: .env
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      - default
      - crawl4ai_api

  # SearXNG — production, PRIVATE: chỉ phục vụ bot Telegram, KHÔNG public ra ngoài.
  # - Bật theo yêu cầu bằng profile:  docker compose --profile searxng up -d
  # - Bot gọi nội bộ qua Docker network: http://searxng:8080
  # - KHÔNG publish port ra host/Internet => không cần limiter, reverse proxy, valkey, domain.
  # - Bắt buộc trước khi chạy: tạo searxng/settings.yml từ searxng/settings.example.yml
  #   và đổi secret_key (xem DEPLOY_SEARXNG_VPS.md).
  searxng:
    # Pin bản đã chứa upstream #6620 (curl_cffi) để tránh drift ngoài ý muốn.
    # Operator vẫn có thể override có chủ đích bằng SEARXNG_IMAGE.
    image: ${SEARXNG_IMAGE:-ghcr.io/searxng/searxng:2026.9.7-3e454637f}
    container_name: fcai-searxng
    profiles: ["searxng"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      # Image hiện tại dùng Granian (không phải uWSGI). Mặc định cho VPS nhỏ:
      # 1 worker, 1 Python blocking thread, tối đa 2 request đồng thời/worker.
      GRANIAN_WORKERS: "1"
      GRANIAN_BLOCKING_THREADS: "${GRANIAN_BLOCKING_THREADS:-1}"
      GRANIAN_BACKPRESSURE: "${GRANIAN_BACKPRESSURE:-2}"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      # SearXNG vẫn đọc cấu hình botdetection kể cả khi server.limiter=false.
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng-cache:/var/cache/searxng
    # Lưu ý: image SearXNG gốc Alpine (busybox wget) — chỉ dùng option chung busybox/GNU wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-t", "1", "-T", "5", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Crawl4AI — private URL rendering backend only. It is NOT a search backend.
  # Start explicitly with: docker compose --profile crawl4ai up -d
  # No host port is published; the bot reaches http://crawl4ai:11235 internally.
  crawl4ai:
    image: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0.9.3}
    container_name: fcai-crawl4ai
    profiles: ["crawl4ai"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    shm_size: "${CRAWL4AI_SHM_SIZE:-512m}"
    networks:
      - crawl4ai_api
      - crawl4ai_proxy
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      CRAWL4AI_EXECUTE_JS_ENABLED: "false"
      CRAWL4AI_HOOKS_ENABLED: "false"
      # The image's localhost DNS-pinning proxy chains through Squid.
      # The REST API forbids client-provided proxy_config in version 0.9.3.
      CRAWL4AI_UPSTREAM_PROXY: http://crawl4ai-proxy:3128
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11235/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Only this service has an Internet-connected Docker network.
  crawl4ai-proxy:
    image: ${CRAWL4AI_PROXY_IMAGE:-ubuntu/squid:6.10-24.10_edge@sha256:e0a69e6c6f6a9f5bf1fb4edd6afa9c0aec23ea89ff8f3077dd5c55e7772438f0}
    container_name: fcai-crawl4ai-proxy
    profiles: ["crawl4ai"]
    restart: unless-stopped
    init: true
    volumes:
      - ./crawl4ai/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - crawl4ai_proxy
      - crawl4ai_uplink

networks:
  crawl4ai_api:
    name: fcai-crawl4ai-api
    internal: true
    enable_ipv6: false
  crawl4ai_proxy:
    name: fcai-crawl4ai-proxy
    internal: true
    enable_ipv6: false
  crawl4ai_uplink:
    name: fcai-crawl4ai-uplink
    enable_ipv6: false

volumes:
  searxng-cache:
