name: fucking-cool-ai-bot

services:
  bot:
    build: .
    container_name: fcai-bot
    env_file: .env
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  # SearXNG — production, PRIVATE: chỉ phục vụ bot Telegram, KHÔNG public ra ngoài.
  # - Bật theo yêu cầu bằng profile:  docker compose --profile searxng up -d
  # - Bot gọi nội bộ qua Docker network: http://searxng:8080
  # - KHÔNG publish port ra host/Internet => không cần limiter, reverse proxy, valkey, domain.
  # - Bắt buộc trước khi chạy: tạo searxng/settings.yml từ searxng/settings.example.yml
  #   và đổi secret_key (xem DEPLOY_SEARXNG_VPS.md).
  searxng:
    # Pin bản đã chứa upstream #6620 (curl_cffi) để tránh DDG CAPTCHA do TLS fingerprint.
    image: ${SEARXNG_IMAGE:-ghcr.io/searxng/searxng:2026.9.7-3e454637f}
    container_name: fcai-searxng
    profiles: ["searxng"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      # Image hiện tại dùng Granian (không phải uWSGI). Mặc định cho VPS nhỏ:
      # 1 worker, 1 Python blocking thread, tối đa 2 request đồng thời/worker.
      GRANIAN_WORKERS: "1"
      GRANIAN_BLOCKING_THREADS: "${GRANIAN_BLOCKING_THREADS:-1}"
      GRANIAN_BACKPRESSURE: "${GRANIAN_BACKPRESSURE:-2}"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      # SearXNG vẫn đọc cấu hình botdetection kể cả khi server.limiter=false.
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng-cache:/var/cache/searxng
    # Lưu ý: image SearXNG gốc Alpine (busybox wget) — chỉ dùng option chung busybox/GNU wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-t", "1", "-T", "5", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  searxng-cache:
