# SearXNG — production, PRIVATE: chỉ phục vụ bot Telegram, KHÔNG public ra ngoài.
#
# CÁCH DÙNG (bắt buộc trước khi chạy profile searxng):
#   1) cp searxng/settings.example.yml searxng/settings.yml
#   2) Sửa searxng/settings.yml -> đổi secret_key thành chuỗi ngẫu nhiên:
#        openssl rand -hex 32
#   3) docker compose --profile searxng up -d
#
# Vì sao file này chỉ gọn như vậy (đã lược bỏ các setting thừa):
# - Bot gọi JSON API nội bộ qua http://searxng:8080; container KHÔNG publish cổng ra
#   host/Internet => instance không public => KHÔNG cần limiter / public_instance /
#   image_proxy / valkey / trusted_proxies / base_url / reverse proxy (mặc định an toàn
#   của SearXNG đã là false hết).
# - Không cần bộ nhớ cache ngoài (Valkey): Valkey chỉ được SearXNG dùng cho limiter/
#   botdetection khi bật public.
# - Không disable engine nào: mặc định của từng bản SearXNG (use_default_settings) đã
#   được upstream bảo trì, tránh danh sách engine cũ gây lỗi khi nâng cấp.

use_default_settings: true

server:
  # BẮT BUỘC đổi thành chuỗi ngẫu nhiên:  openssl rand -hex 32
  # (searxng/settings.yml đã nằm trong .gitignore nên secret không bị commit.
  #  Muốn đặt qua biến môi trường thì thêm SEARXNG_SECRET cho service searxng — giá trị
  #  env sẽ override dòng này — nhưng repo không dùng để tránh hai nguồn secret.)
  secret_key: "REPLACE_WITH_openssl_rand_-hex_32"

search:
  # Bot gọi API dạng format=json nên bắt buộc có json. html giữ lại để xem UI khi debug
  # nội bộ (docker compose exec ... wget ...). Mặc định upstream chỉ bật html.
  formats:
    - html
    - json
