# SearXNG — production, PRIVATE: chỉ phục vụ bot Telegram, KHÔNG public ra ngoài.
#
# CÁCH DÙNG (bắt buộc trước khi chạy profile searxng):
#   1) cp searxng/settings.example.yml searxng/settings.yml
#   2) Sửa searxng/settings.yml -> đổi secret_key thành chuỗi ngẫu nhiên:
#        openssl rand -hex 32
#   3) docker compose --profile searxng up -d --build
#
# Nếu đã có settings.yml: merge các thay đổi bên dưới, GIỮ secret_key hiện tại.
# Sửa file mẫu không tự cập nhật file thật đang được mount trong container.
# Bot gọi JSON API qua http://searxng:8080; KHÔNG publish port, không cần
# reverse proxy / Valkey. limiter.toml vẫn được đọc dù limiter tắt (xem file đó).

use_default_settings:
  engines:
    remove:
      # Engine onion cần Tor; instance này không cấu hình Tor.
      # remove loại khỏi quá trình load, không chỉ bỏ chọn như disabled: true.
      - ahmia
      - torch
      # Workaround cho Startpage parser lỗi JSON. SearXNG định nghĩa web/news/images
      # là ba engine name riêng và `remove` so khớp chính xác theo `name`, vì vậy
      # phải remove đủ cả ba để tránh Startpage Images vẫn chạy và ghi warning.
      - startpage
      - startpage news
      - startpage images
      # DuckDuckGo HTML hiện thường trả CAPTCHA trên datacenter egress. Engine
      # thay thế `duckduckgo web` cũng đang có upstream bot-detection/KeyError
      # và mặc định đã disabled, nên không enable override cho nó ở đây.
      - duckduckgo
      # Wikipedia đang trả HTTP 400 trên deployment đã quan sát.
      - wikipedia

server:
  # BẮT BUỘC đổi thành chuỗi ngẫu nhiên: openssl rand -hex 32
  # settings.yml đã nằm trong .gitignore. Không đặt thêm SEARXNG_SECRET trong
  # service searxng vì env sẽ override dòng này, tạo hai nguồn cấu hình secret.
  secret_key: "REPLACE_WITH_openssl_rand_-hex_32"
  # Khai báo rõ mode private, không phụ thuộc mặc định của image khi nâng cấp.
  limiter: false
  public_instance: false

search:
  # Bot gọi format=json nên bắt buộc có json (upstream chỉ bật html mặc định).
  # html giữ lại để debug UI nội bộ bằng docker compose exec, không mở port.
  formats:
    - html
    - json
  # Không retry dồn dập engine vừa bị upstream chặn. 429 giữ engine ngoài vòng
  # search trong 1 giờ; CAPTCHA/access-denied cooldown dài hơn.
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800

# Global engine timeout ngắn để SearXNG phản hồi nhanh; Google CSE được nới riêng
# lên 5s vì log production cho thấy đôi lúc vượt default 3s.
outgoing:
  request_timeout: 3.0
  max_request_timeout: 5.0

# Khi use_default_settings được bật, entry cùng `name` sẽ merge vào engine mặc định.
engines:
  - name: google cse
    timeout: 5.0
  - name: google cse images
    timeout: 5.0
