[[providers]]
id = "chainnode"
driver = "openai-chat"
default_base_url = "https://dn.chainno.de/v1"
default_timeout_sec = 60.0

[providers.routes.text]
enabled = true

[providers.routes.vision]
enabled = true
supports_vision = true
max_images = 1

[[providers]]
id = "openrouter"
driver = "openai-chat"
default_base_url = "https://openrouter.ai/api/v1"
default_timeout_sec = 60.0

[providers.routes.text]
enabled = true

[providers.routes.vision]
enabled = true
supports_vision = true
max_images = 1

[providers.driver_options]
provider_preferences = true

[[providers.recovery]]
status = 402
action = "rotate_target"
scope = "credential"
effect = "disable"

[[providers.recovery]]
status = 403
action = "rotate_target"
scope = "entitlement"
effect = "disable"

[[providers.recovery]]
status = 429
action = "rotate_target"
scope = "credential"
effect = "cooldown"

[[providers]]
id = "opencode"
driver = "openai-chat"
# Go subscription gateway. Workspaces on Zen pay-as-you-go override this with
# AI_PROVIDERS__OPENCODE__BASE_URL=https://opencode.ai/zen/v1: a Go key sent to
# the Zen gateway is billed against prepaid Zen credit and fails with HTTP 402.
default_base_url = "https://opencode.ai/zen/go/v1"
default_timeout_sec = 60.0

[providers.routes.text]
enabled = true

[providers.routes.vision]
enabled = true
supports_vision = true
max_images = 1

[[providers.recovery]]
status = 402
action = "rotate_target"
scope = "credential"
effect = "disable"

[[providers.recovery]]
status = 403
action = "rotate_target"
scope = "entitlement"
effect = "disable"

[[providers.recovery]]
status = 429
action = "rotate_target"
scope = "credential"
effect = "cooldown"

[providers.driver_options]
# OpenCode Go rejects requests without a stable session id (HTTP 400
# MissingSessionID). The router mints one opaque `ses_<32 hex>` per completion
# when the caller has no conversation id; the driver's per-target id is only
# a fallback for direct driver calls.
session_header = "x-opencode-session"
extra_headers = { "User-Agent" = "fucking-cool-ai-bot/1.0" }
