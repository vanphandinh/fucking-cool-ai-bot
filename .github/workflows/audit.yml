name: Audit checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies and audit tools
        run: |
          python -m pip install --upgrade 'pip>=26.2' 'setuptools>=83.0.0'
          python -m pip install -r requirements.txt ruff==0.16.6 pip-audit==2.10.1
      - name: Validate SearXNG YAML
        if: matrix.python == '3.12'
        run: |
          python -m pip install 'PyYAML>=6.0,<7.0'
          python -c "from pathlib import Path; import yaml; path = Path('searxng/settings.example.yml'); yaml.safe_load(path.read_text(encoding='utf-8')); print(f'Validated {path}')"
      - name: Check lint and dependency compatibility
        run: |
          python -m ruff check .
          python -m pip check
          python -m compileall -q app tests
      - name: Offline regression and integration tests
        run: |
          set +e
          python tests/run_tests.py > test-output.txt 2>&1
          legacy_status=$?
          python -m unittest discover -s tests -p 'test_*.py' -v >> test-output.txt 2>&1
          unittest_status=$?
          cat test-output.txt
          if [ "$legacy_status" -ne 0 ] || [ "$unittest_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output-py${{ matrix.python }}
          path: test-output.txt
          if-no-files-found: ignore
      - name: Audit installed dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Build production image
        if: matrix.python == '3.12'
        run: docker build --tag fcai-audit:${{ github.sha }} .
