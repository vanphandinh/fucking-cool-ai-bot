name: Audit checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the newest patch line we run locally; keeping it in the matrix
        # catches interpreter-level breakage before the bot image moves to it.
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies and audit tools
        run: |
          python -m pip install --upgrade 'pip>=26.2' 'setuptools>=83.0.0'
          # Runtime deps come from the lock (exact pins); --no-deps keeps pip from
          # drifting past it. requirements.txt stays the range declaration and is
          # reconciled with the lock by tests/test_requirements_lock.py.
          python -m pip install -r requirements.lock.txt --no-deps
          python -m pip install -r requirements-audit.txt ruff==0.16.6 pip-audit==2.10.1
      - name: Prepare Compose environment for tests
        run: cp .env.example .env
      - name: Validate SearXNG YAML
        if: matrix.python == '3.12'
        run: |
          python -m pip install 'PyYAML>=6.0,<7.0'
          python -c "from pathlib import Path; import yaml; path = Path('searxng/settings.example.yml'); yaml.safe_load(path.read_text(encoding='utf-8')); print(f'Validated {path}')"
      - name: Validate Docker Compose
        if: matrix.python == '3.12'
        run: docker compose config --quiet
      - name: Validate Linux security scripts
        if: matrix.python == '3.12'
        run: |
          bash -n scripts/crawl4ai_firewall.sh scripts/check_crawl4ai_vps_staging.sh \
            scripts/install_crawl4ai_firewall_boot.sh scripts/check_crawl4ai_report.sh \
            scripts/verify_crawl4ai_security.sh scripts/apply_crawl4ai_safe_boot.sh
      - name: Check lint and dependency compatibility
        run: |
          python -m ruff check .
          python -m pip check
          python -m compileall -q app tests scripts
      - name: Check canonical environment vocabulary
        run: python scripts/check_canonical_env_vocabulary.py
      - name: Check Markdown links
        run: python scripts/check_markdown_links.py
      - name: Targeted Crawl4AI tests
        run: |
          python -m unittest discover -s tests -p 'test_crawl4ai*.py' -v
          python -m unittest discover -s tests -p 'test_url_service.py' -v
          python -m unittest discover -s tests -p 'test_url_tool_integration.py' -v
      - name: Renewable core and Telegram tests
        run: python -m unittest discover -s tests -p 'test_job_*.py' -v
      - name: Renewal flow tests
        run: python -m unittest discover -s tests -p 'test_question_renewal_flow.py' -v
      - name: Bounded thread tests
        run: python -m unittest discover -s tests -p 'test_thread_work.py' -v
      - name: URL dedupe tests
        run: python -m unittest discover -s tests -p 'test_tool_url_dedupe.py' -v
      - name: Offline regression and integration tests
        run: |
          python tests/run_tests.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit installed dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Build production image
        if: matrix.python == '3.12'
        run: docker build --tag fcai-audit:${{ github.sha }} .
      - name: Smoke production image configuration
        if: matrix.python == '3.12'
        run: |
          docker run --rm --entrypoint python fcai-audit:${{ github.sha }} \
            -c "from app.config import Settings; Settings(_env_file=None); print('Production image configuration OK')"
